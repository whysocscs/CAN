name: canlite

services:
  backend:
    image: canlite-backend:local
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    environment:
      CANLITE_CAN_MODE: loopback
      CANLITE_ENABLE_REAL_TERMINAL: "false"
      CANLITE_TERMINAL_ORIGINS: http://127.0.0.1:8447,http://localhost:8447
    ports:
      - target: 8010
        published: "8010"
        host_ip: 127.0.0.1
        protocol: tcp
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    restart: "no"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    image: canlite-frontend:local
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
      lab-terminal:
        condition: service_healthy
    ports:
      - target: 8080
        published: "8447"
        host_ip: 127.0.0.1
        protocol: tcp
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    restart: "no"
    networks:
      - default
      - lab-terminal-internal
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/health
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  lab-terminal:
    image: canlite-lab-terminal:local
    build:
      context: .
      dockerfile: docker/lab-terminal.Dockerfile
    environment:
      CANLITE_TERMINAL_ORIGINS: http://127.0.0.1:8447,http://localhost:8447
    expose:
      - "8020"
    read_only: true
    tmpfs:
      - /workspace:rw,nosuid,nodev,size=32m,uid=10001,gid=10001,mode=0700
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 64
    mem_limit: 192m
    cpus: 0.5
    restart: "no"
    networks:
      - lab-terminal-internal
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=2)); assert data['vcan0'] is True
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

networks:
  lab-terminal-internal:
    internal: true
